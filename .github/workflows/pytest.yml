name: Pytest

on: [push]

jobs:
    build:
        permissions:
            contents: read
        environment:
            name: testing
        env:
            COOKIE: ${{ secrets.COOKIE }}
        runs-on: ubuntu-latest
        steps:
        - uses: actions/checkout@v5
        - name: Set up Python
          uses: actions/setup-python@v5
          with:
                python-version: '3.12'
                cache: 'pip'
        - name: Install dependencies
          run: |
                python -m pip install --upgrade pip
                pip install -r requirements.txt
        - name: Test with pytest
          run: |
                python -m pytest app/tests/ --doctest-modules --junitxml=junit/test-results.xml --cov=app --cov-report=xml --cov-report=html
        - name: Upload test artifacts
          uses: actions/upload-artifact@v4
          with:
                name: test-artifacts
                path: |
                    junit/test-results.xml
                    htmlcov/
                    coverage.xml